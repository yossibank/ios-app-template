included:
  - Package/Sources
  - App/AppTemplate

disabled_rules:
  - line_length            # SwiftFormat の --maxwidth 120
  - colon
  - opening_brace
  - trailing_comma         # SwiftFormat の --commas inline

  - cyclomatic_complexity
  - nesting
  - file_length
  - type_body_length
  - function_body_length
  - function_parameter_count

  - todo

type_name:
  max_length: 60
identifier_name:
  min_length: 1
  max_length: 60

opt_in_rules:
  - empty_count
  - closure_spacing
  - redundant_nil_coalescing
  - explicit_init
  - first_where
  - toggle_bool

custom_rules:
  shared_import_outside_core:
    name: "共通コアの直接 import"
    regex: '^[ \t]*(@_exported[ \t]+)?import[ \t]+Shared\b'
    message: "共通コアは SharedCore 経由で使う。SharedCore 以外から import Shared しない"
    severity: error
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    excluded:
      - ".*/Package/Sources/SharedCore/.*"

  global_function:
    name: "グローバル関数"
    regex: '^(?:@\w+(?:\([^)]*\))?[ \t]+)*(?:(?:private|fileprivate|internal|public|open)[ \t]+)*func[ \t]'
    message: "グローバル関数を作らない。型のメソッドか、対象の型への extension にする"
    severity: error
    excluded_match_kinds:
      - comment
      - doccomment
      - string

