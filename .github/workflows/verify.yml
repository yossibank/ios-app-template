name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app
  SHARED_CORE_TOKEN: ${{ secrets.SHARED_CORE_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  verify:
    name: Build
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Start booting the simulator
        run: make boot

      - name: Configure git credentials
        run: |
          git config --global \
            url."https://${{ github.actor }}:${SHARED_CORE_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Configure netrc
        run: |
          umask 077
          cat > "$HOME/.netrc" <<NETRC
          machine github.com
            login ${{ github.actor }}
            password ${SHARED_CORE_TOKEN}
          machine api.github.com
            login ${{ github.actor }}
            password ${SHARED_CORE_TOKEN}
          NETRC

      - name: Cache lint tools
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lint-tools
          key: lint-tools-${{ runner.os }}-${{ hashFiles('Mintfile') }}

      - name: Install lint tools
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/lint-tools"
          mkdir -p "$tools"

          version() {
            sed -n "s|^$1@||p" Mintfile
          }

          if [ ! -x "$tools/swiftformat" ] || [ ! -x "$tools/swiftlint" ]; then
            curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
              "https://github.com/nicklockwood/SwiftFormat/releases/download/$(version nicklockwood/SwiftFormat)/swiftformat.zip"
            curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
              "https://github.com/realm/SwiftLint/releases/download/$(version realm/SwiftLint)/portable_swiftlint.zip"

            unzip -oq "$RUNNER_TEMP/swiftformat.zip" swiftformat -d "$tools"
            unzip -oq "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$tools"
            chmod +x "$tools/swiftformat" "$tools/swiftlint"
          fi

          echo "$tools" >> "$GITHUB_PATH"
          echo "SWIFTFORMAT=swiftformat" >> "$GITHUB_ENV"
          echo "SWIFTLINT=swiftlint" >> "$GITHUB_ENV"

      - name: Show lint tool versions
        run: |
          swiftformat --version
          swiftlint version

      - name: Wait for the simulator
        run: make boot-wait

      - name: Verify
        run: make verify
