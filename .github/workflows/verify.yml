name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app
  # 共通コアが private の場合、GITHUB_TOKEN では別リポジトリを clone できない
  # （remote: Repository not found. になる）。その場合は SHARED_CORE_TOKEN に
  # repo スコープを持つ PAT を登録する。public の間は GITHUB_TOKEN で足りる。
  SHARED_CORE_TOKEN: ${{ secrets.SHARED_CORE_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  verify:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      # SPM は 2 か所で認証を要求する。
      #   github.com     … Package.swift を読むための git clone
      #   api.github.com … binaryTarget の Release アセットのダウンロード
      # 共通コアが private の場合、どちらか一方でも欠けると解決に失敗する。
      # git は netrc を既定で読まないため、clone 用の資格情報は別に設定する。
      - name: Configure git credentials
        run: |
          git config --global \
            url."https://${{ github.actor }}:${SHARED_CORE_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Configure netrc
        run: |
          umask 077
          cat > "$HOME/.netrc" <<NETRC
          machine github.com
            login ${{ github.actor }}
            password ${SHARED_CORE_TOKEN}
          machine api.github.com
            login ${{ github.actor }}
            password ${SHARED_CORE_TOKEN}
          NETRC

      - name: Verify
        run: make verify
