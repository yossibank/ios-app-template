name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app
  # 共通コアが private の場合、GITHUB_TOKEN では別リポジトリを clone できない。
  # その場合は SHARED_CORE_TOKEN に repo スコープを持つ PAT を登録する。
  SHARED_CORE_TOKEN: ${{ secrets.SHARED_CORE_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  verify:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      # SPM は github.com（clone）と api.github.com（アセット取得）の 2 か所で
      # 認証を要求し、片方でも欠けると解決に失敗する。
      # git は netrc を読まないため、clone 用は別に設定する。
      - name: Configure git credentials
        run: |
          git config --global \
            url."https://${{ github.actor }}:${SHARED_CORE_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Configure netrc
        run: |
          umask 077
          cat > "$HOME/.netrc" <<NETRC
          machine github.com
            login ${{ github.actor }}
            password ${SHARED_CORE_TOKEN}
          machine api.github.com
            login ${{ github.actor }}
            password ${SHARED_CORE_TOKEN}
          NETRC

      - name: Install lint tools
        run: |
          command -v swiftformat >/dev/null || brew install swiftformat
          command -v swiftlint   >/dev/null || brew install swiftlint

      - name: Verify
        run: make verify
