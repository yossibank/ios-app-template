name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app
  SHARED_CORE_TOKEN: ${{ secrets.SHARED_CORE_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  verify:
    name: Build
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Start booting the simulator
        run: make boot

      - name: Configure git credentials
        run: |
          git config --global \
            url."https://${{ github.actor }}:${SHARED_CORE_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Configure netrc
        run: |
          umask 077
          cat > "$HOME/.netrc" <<NETRC
          machine github.com
            login ${{ github.actor }}
            password ${SHARED_CORE_TOKEN}
          machine api.github.com
            login ${{ github.actor }}
            password ${SHARED_CORE_TOKEN}
          NETRC

      - name: Install lint tools
        run: |
          command -v swiftformat >/dev/null || brew install swiftformat
          command -v swiftlint   >/dev/null || brew install swiftlint

      - name: Wait for the simulator
        run: make boot-wait

      - name: Verify
        run: make verify
