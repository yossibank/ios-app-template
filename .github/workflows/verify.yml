name: Verify

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode.app

jobs:
  build:
    name: Build
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create a token for the shared core
        id: shared-core-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SHARED_CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SHARED_CORE_APP_PRIVATE_KEY }}
          repositories: kmp-app-template
          permission-contents: read

      - name: Configure git credentials
        env:
          SHARED_CORE_TOKEN: ${{ steps.shared-core-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${SHARED_CORE_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Configure netrc
        env:
          SHARED_CORE_TOKEN: ${{ steps.shared-core-token.outputs.token }}
        run: |
          umask 077
          cat > "$HOME/.netrc" <<NETRC
          machine github.com
            login x-access-token
            password ${SHARED_CORE_TOKEN}
          machine api.github.com
            login x-access-token
            password ${SHARED_CORE_TOKEN}
          NETRC

      - name: Install lint tools
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/lint-tools"
          mkdir -p "$tools"

          version() {
            sed -n "s|^$1@||p" Mintfile
          }

          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$(version nicklockwood/SwiftFormat)/swiftformat.zip"
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$(version realm/SwiftLint)/portable_swiftlint.zip"

          unzip -oq "$RUNNER_TEMP/swiftformat.zip" swiftformat -d "$tools"
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$tools"
          chmod +x "$tools/swiftformat" "$tools/swiftlint"

          echo "$tools" >> "$GITHUB_PATH"
          echo "SWIFTFORMAT=swiftformat" >> "$GITHUB_ENV"
          echo "SWIFTLINT=swiftlint" >> "$GITHUB_ENV"

      - name: Show lint tool versions
        run: |
          swiftformat --version
          swiftlint version

      - name: Lint
        run: make lint testplan

      - name: Build for testing
        run: >-
          xcodebuild build-for-testing
          -workspace AppTemplate.xcworkspace
          -scheme AppTemplate
          -destination 'generic/platform=iOS Simulator'
          -testProductsPath "$RUNNER_TEMP/AppTemplate.xctestproducts"
          ARCHS=arm64
          SWIFT_SUPPRESS_WARNINGS=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Pack the test products
        run: tar -cf "$RUNNER_TEMP/test-products.tar" -C "$RUNNER_TEMP" AppTemplate.xctestproducts

      - name: Upload the test products
        uses: actions/upload-artifact@v7
        with:
          name: test-products
          path: ${{ runner.temp }}/test-products.tar
          retention-days: 1
          compression-level: 0

  test:
    name: Test
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start booting the simulator
        run: make boot

      - name: Wait for the test products
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          until gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].name' | grep -qx test-products; do
            build="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --jq '.jobs[] | select(.name == "Build") | .conclusion // empty')"
            if [ -n "$build" ] && [ "$build" != success ]; then
              echo "Build が ${build} で終わったのでテストしません" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Download the test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}

      - name: Unpack the test products
        run: tar -xf "$RUNNER_TEMP/test-products.tar" -C "$RUNNER_TEMP"

      - name: Wait for the simulator
        run: make boot-wait

      - name: Test
        run: |
          udid="$(xcrun simctl list devices booted -j | jq -r '[.devices[][]][0].udid')"
          xcodebuild test-without-building \
            -testProductsPath "$RUNNER_TEMP/AppTemplate.xctestproducts" \
            -destination "id=${udid}"
